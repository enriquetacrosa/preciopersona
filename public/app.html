<!--SERVER-START--><!doctype html>
<html lang="es">
<head>

<title>PrecioZona</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;700&display=swap">
<style>
/* Layout: back-office de una columna con secciones plegables; tienda de prueba como grilla de productos con carrito lateral */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --tint:#e7eeec; --line:#d6dfdc;
  --fg:#1d2a2e; --soft:#56666b; --accent:#2f6f73; --accent-fg:#ffffff;
  --ok-bg:#dcefe3; --ok:#1d6b40; --warn-bg:#f6e8c4; --warn:#7a5600; --bad-bg:#f6dad6; --bad:#9c2f26; --idle-bg:#e9ecec; --idle:#56666b;
  --code:#eef2f1; --bar:#2f6f73; --scrim:rgba(10,16,18,.55);
  --display:"Bricolage Grotesque", "Arial Narrow", Arial, sans-serif;
  --body:"Manrope", "Segoe UI", Arial, sans-serif;
  --mono:ui-monospace, Consolas, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a1c; --surface:#1a2427; --tint:#223034; --line:#2f3f43;
  --fg:#e6eeec; --soft:#a1b1b4; --accent:#7cc3c6; --accent-fg:#0f1a1c;
  --ok-bg:#1d3a2a; --ok:#8fd8aa; --warn-bg:#3a3018; --warn:#f0cf7c; --bad-bg:#43211e; --bad:#f2a49c; --idle-bg:#263234; --idle:#a1b1b4;
  --code:#0f1618; --bar:#7cc3c6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a1c; --surface:#1a2427; --tint:#223034; --line:#2f3f43;
  --fg:#e6eeec; --soft:#a1b1b4; --accent:#7cc3c6; --accent-fg:#0f1a1c;
  --ok-bg:#1d3a2a; --ok:#8fd8aa; --warn-bg:#3a3018; --warn:#f0cf7c; --bad-bg:#43211e; --bad:#f2a49c; --idle-bg:#263234; --idle:#a1b1b4;
  --code:#0f1618; --bar:#7cc3c6; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,select,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--soft);font-size:14px}
.notice{background:var(--tint);color:var(--soft);font-size:13px;text-align:center;padding-block:7px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:18px;padding-block:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.5px;text-decoration:none}
.logo i{font-style:normal;color:var(--accent)}
.tagline{font-size:13px;color:var(--soft)}
.sp{flex:1}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{text-decoration:none;font-size:14px;padding:7px 12px;border-radius:8px;color:var(--soft)}
.nav a.on{background:var(--tint);color:var(--fg);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.6;cursor:wait}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;font-size:inherit}
.page{padding-block:24px 56px}
.page h1{font-family:var(--display);font-size:30px;letter-spacing:-.5px;margin:0 0 4px;text-wrap:balance}
.lead{max-width:66ch;color:var(--soft);margin:0 0 16px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--tint);border-radius:10px;padding:4px;margin:16px 0 20px;width:fit-content;max-width:100%}
.tabs button{border:0;background:none;padding:8px 13px;border-radius:7px;cursor:pointer;color:var(--soft);font-size:14px}
.tabs button.on{background:var(--surface);color:var(--fg);font-weight:700}
.steps{display:flex;gap:16px;margin:16px 0 20px;flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft)}
.stp b{display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;background:var(--tint);color:var(--soft);font-size:13px}
.stp.on{color:var(--fg);font-weight:700}
.stp.on b{background:var(--accent);color:var(--accent-fg)}
.stp.done b{background:var(--ok-bg);color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .l{font-size:12px;color:var(--soft);text-transform:uppercase;letter-spacing:1px}
.kpi .v{font-size:24px;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;min-width:0}
.panel h2{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.panel select,.panel input,.panel textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.panel input[type=number]{width:96px}
.siteinput{display:flex;gap:10px;flex-wrap:wrap}
.siteinput input{flex:1;min-width:240px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--soft);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.8px;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
td.nw{white-space:nowrap}
th.tog{cursor:pointer;user-select:none}
th.tog:hover{color:var(--fg)}
th.tog.off{color:var(--soft);opacity:.65}
td.off{color:transparent}
td.off *{visibility:hidden}
.light,.st,.tag{display:inline-block;font-weight:700;border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap}
.l-verde,.st-ok{background:var(--ok-bg);color:var(--ok)}
.l-amarillo,.st-manual,.tag-sim{background:var(--warn-bg);color:var(--warn)}
.l-rojo,.st-error{background:var(--bad-bg);color:var(--bad)}
.st-sin-link,.st-pendiente,.tag-gray{background:var(--idle-bg);color:var(--idle)}
.tag-mismo{background:var(--ok-bg);color:var(--ok)}
.tag-similar{background:var(--tint);color:var(--accent)}
.note{font-size:12px;color:var(--soft);margin-top:3px}
.formula{font-family:var(--mono);font-size:13px;background:var(--code);border-radius:8px;padding:12px;white-space:pre-wrap;overflow-x:auto}
.chk{display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:13px;white-space:nowrap}
.msg{font-size:14px;color:var(--accent);margin-bottom:12px}
.why{font-size:11.5px;color:var(--soft);line-height:1.3;margin-top:3px;white-space:normal;max-width:170px}
.savebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:10px 14px;margin:0 0 16px;font-size:14px}
.savebar b{color:var(--fg)}.savebar .sp{flex:1 1 220px;min-width:0}
.savebar .btn{background:var(--surface);color:var(--fg)}
.intro{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:0 0 16px}
.intro ol{margin:6px 0 8px;padding-left:20px}.intro li{margin:3px 0}
.intro summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:14px}
.intro details[open] summary{margin-bottom:12px}
.err{color:var(--bad);font-size:14px}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.choice{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer}
.choice.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.choice input{margin-top:4px;accent-color:var(--accent)}
.choice b{display:block;margin-bottom:2px}
/* acordeones */
.acc{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;min-width:0}
.acc-head{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:14px 16px;cursor:pointer;text-align:left}
.acc-head .arrow{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--tint);align-items:center;justify-content:center;transition:transform .15s;flex:none}
.acc.open .acc-head .arrow{transform:rotate(180deg)}
.acc-title{font-weight:700;flex:1;min-width:0}
.acc-body{padding:0 16px 16px}
/* popover del cálculo */
.calc-btn{background:var(--tint);border:0;border-radius:999px;width:24px;height:24px;cursor:pointer;font-size:13px;font-weight:700;color:var(--accent)}
.popover{position:fixed;z-index:40;max-width:min(560px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.2);padding:14px}
.popover h3{margin:0 0 8px;font-size:15px}
.flow{display:flex;gap:10px;flex-wrap:wrap}
.step{flex:1;min-width:170px;background:var(--tint);border-radius:10px;padding:14px;font-size:14px}
.step b{display:block;margin-bottom:4px}
.login{max-width:380px;margin:8vh auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px}
.login input{width:100%;margin:12px 0;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}
.full{width:100%}
.bar{height:8px;border-radius:999px;background:var(--tint);overflow:hidden;min-width:80px}
.bar span{display:block;height:100%;background:var(--bar)}
.factors{display:grid;grid-template-columns:minmax(0,1.4fr) 60px minmax(80px,1fr) 52px;gap:6px 12px;align-items:center;font-size:14px}
.dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:4px 14px;font-size:14px}
.dl dt{color:var(--soft)}
.dl dd{margin:0}
.api{font-family:var(--mono);font-size:13px;background:var(--code);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:nowrap}
textarea.copy{width:100%;min-height:120px;font-family:var(--mono);font-size:12px}
/* tienda de prueba */
.demo-bar{background:var(--fg);color:var(--bg);font-size:13px;padding-block:8px}
.demo-bar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo-bar select{background:var(--bg);color:var(--fg);border:0;border-radius:6px;padding:4px 8px;font-size:13px}
.demo-bar button{background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:3px 8px;font-size:13px;cursor:pointer}
.shop-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-block:18px 8px}
.shop-head h1{margin:0}
.where{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.where select{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--surface);max-width:100%}
.seg{display:inline-flex;gap:4px;background:var(--tint);border-radius:10px;padding:4px}
.seg button{border:0;background:none;border-radius:7px;padding:6px 12px;cursor:pointer;font-size:14px;color:var(--soft);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.pcard .ph{height:110px;border-radius:10px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-family:var(--display);color:var(--soft);font-size:13px;text-align:center;padding:10px}
.pcard h3{font-size:15px;margin:0;line-height:1.3}
.pcard .pr{font-size:26px;font-weight:700;line-height:1.1;margin-top:auto}
.pcard .lock{font-size:14px;color:var(--soft);margin-top:auto;background:var(--tint);border-radius:8px;padding:8px 10px}
.cartbtn{position:relative}
.cartbtn b{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:35;padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 18px 18px;overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.drawer h2{font-family:var(--display);margin:0 0 12px}
.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:50}
.cookie{background:var(--surface);border-radius:16px;max-width:620px;width:100%;padding:22px;margin-bottom:max(0px,env(safe-area-inset-bottom,0px))}
.cookie h3{font-family:var(--display);font-size:22px;margin:0 0 6px}
.cookie{max-height:calc(100% - 16px);overflow:auto}
.terms{font-size:11px;line-height:1.45;color:var(--soft);max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px}
.terms p{margin:0 0 6px}
.shots{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.shots img{height:84px;border-radius:8px;border:1px solid var(--line)}
.unblock{border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:16px;margin-bottom:16px}
.unblock h3{margin:0 0 6px;font-size:17px}
.unblock ol{margin:8px 0;padding-left:20px;font-size:14px}
.unblock code{font-family:var(--mono);font-size:12px;background:var(--surface);color:var(--fg);border-radius:4px;padding:1px 5px}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.actions .btn{flex:1}
@media (max-width:860px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .choices,.cards{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr}
  .factors{grid-template-columns:minmax(0,1fr) 50px 52px}
  .factors .bar{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="notice gut" id="notice">Proyecto académico · ORT 2026</div>
<header class="top">
  <div class="gut"><div class="wrap hbar">
    <div><a class="logo" href="#admin">Precio<i>Zona</i></a><div class="tagline">Motor de precios para tiendas online</div></div>
    <div class="sp"></div>
    <nav class="nav" id="nav"><a href="#admin">Back-office</a><a href="#tienda">Tienda de prueba</a></nav>
  </div></div>
</header>

<main id="app"><div class="gut"><div class="wrap page"><p class="muted">Cargando…</p></div></div></main>
<div class="popover" id="popover" hidden></div>

<script>window.CC_MODE = "local";</script>
<!--ENGINE--><script src="/engine.js"></script><!--/ENGINE-->
<script>
const SERVER = window.CC_MODE === "server";
const E = window.Engine;
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const fmt = n => n > 0 ? "$ " + Math.round(n).toLocaleString("es-UY") : "—";
const pct = n => (n * 100).toFixed(1).replace(".", ",") + "%";
const sgn = n => (n > 0 ? "+" : "") + pct(n);
const dec = n => Number(n).toFixed(2).replace(".", ",");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const when = iso => iso ? new Date(iso).toLocaleString("es-UY", { dateStyle: "short", timeStyle: "short" }) : "";
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };
function readStore(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function writeStore(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

// ================= DATOS DE LA SIMULACIÓN (solo vista previa) =================
// Real = leído de la web el 10/11/2026 o del relevamiento del Obligatorio 1. Simulado = dato de ejemplo.
const FS = "https://tienda.farmashop.com.uy/";
const SIM_CATALOGS = {
  "farmashop.com.uy": [
    { name: "Crema Hidratante CeraVe Corporal 454 g", url: FS + "crema-hidratante-cerave-corporal-454-g.html", price: 1635 },
    { name: "Crema Corporal Cicatricure Antiestrías 400 ml", url: FS + "598139.html", price: 525 },
    { name: "Crema Corporal Nivea Reafirmante Q10 Plus 250 ml", url: FS + "nivea-body-reafirmante-q10-plus-250ml.html", price: 690, simulated: true },
    { name: "Crema Corporal Six Leche de Coco 195 g", url: FS + "six-crema-corporal-leche-de-coco-195-grs.html", price: 289, simulated: true },
    { name: "Crema Corporal Dermavite Urea 530 ml", url: FS + "dermavite-crema-corporal-urea-530-ml.html", price: 749, simulated: true },
    { name: "Crema Sebamed Corporal 200 ml", url: FS + "sebamed-crema-corporal-200-ml.html", price: 980, simulated: true }
  ],
  "sanroque.com.uy": [
    { name: "CeraVe Crema Hidratante 454 g", price: 1600 },
    { name: "Nivea Crema Corporal Reafirmante Q10 400 ml", price: 899, simulated: true },
    { name: "Sebamed Crema Corporal 200 ml", price: 1050, simulated: true }
  ],
  "farmacity.com.uy": [
    { name: "Crema Corporal CeraVe Hidratante x 454 g", url: "https://www.farmacity.com.uy/crema-corporal-cerave-hidratante-x-454-g/p", price: 1600 },
    { name: "Six Crema Corporal Coco 400 g", price: 520, simulated: true },
    { name: "Dermaglós Crema Corporal Urea 10% 500 ml", price: 690, simulated: true }
  ],
  "pigalle.com.uy": [
    { name: "CeraVe Crema Hidratante 454 g", price: 1199 },
    { name: "Nivea Q10 Reafirmante Crema Corporal 250 ml", price: 650, simulated: true },
    { name: "Cicatricure Crema Antiestrías 400 ml", price: 499, simulated: true }
  ]
};
const DEMO_CUSTOMERS = E.DEMO_CUSTOMERS;
function simCatalog(url) {
  const h = host(url);
  const key = Object.keys(SIM_CATALOGS).find(k => h.endsWith(k));
  return key ? SIM_CATALOGS[key] : null;
}

// ================= BACKEND =================
const Local = {
  db: (() => { const d = readStore("pz-db3"); if (d) return E.migrate(d); const s = E.clone(E.SEED); s.customers = E.clone(DEMO_CUSTOMERS); return s; })(),
  logged: false,
  persist() { writeStore("pz-db3", this.db); },
  get() { return this.db; },
  save(d) { this.db = d; this.persist(); return d; },
  async scanCompany(site) {
    await new Promise(r => setTimeout(r, 900));
    const db = this.db; db.company.site = site;
    const cat = simCatalog(site) || simCatalog(FS);
    const old = Object.fromEntries(db.products.map(p => [p.id, p]));
    // Simulación: hasta que la tienda habilita el acceso, sus páginas protegidas rechazan la lectura
    const blocked = !db.company.unblocked;
    db.products = cat.map(it => { const id = E.slug(it.name), stop = blocked && it.simulated, prev = old[id] || {};
      return { id, name: it.name, url: it.url, currentPrice: stop ? (prev.status === "manual" ? prev.currentPrice : null) : it.price, cost: prev.cost ?? null,
        status: stop ? (prev.status === "manual" ? "manual" : "bloqueado") : "ok", note: stop ? "La tienda rechazó la lectura automática" : "", simulated: !stop && !!it.simulated, updated: new Date().toISOString() }; });
    const nb = db.products.filter(p => p.status === "bloqueado").length;
    db.company.blocked = nb ? { count: nb, total: db.products.length } : null;
    db.company.lastScan = new Date().toISOString();
    this.persist(); return db;
  },
  async scanCompetitors() {
    await new Promise(r => setTimeout(r, 1100));
    const db = this.db;
    db.chains.forEach(c => {
      c.lastScan = new Date().toISOString();

// ---------- Eventos del back-office ----------
async function withBusy(fn) { busy = true; render(); try { await fn(); } catch (e) { flash = e.message; } busy = false; render(); }
function bindAdmin() {
  if (!adminOk) {
    $("#loginForm").onsubmit = async e => {
      e.preventDefault();
      if (SERVER) { try { db = await Remote.login($("#pw").value); adminOk = true; render(); } catch (err) { $("#pwErr").textContent = err.message; } return; }
      if ($("#pw").value === "ort2026") { adminOk = true; render(); } else $("#pwErr").textContent = "Contraseña incorrecta.";
    };
    return;
  }
  const go = t => {
    adminTab = t; flash = ""; priceMode = null; showAll = false; render(); window.scrollTo(0, 0);
    // En Render se traen los datos nuevos (visitantes y pedidos que llegan desde la web de la tienda)
    if (SERVER && ["panel", "clientes"].includes(t)) Remote.flush().then(() => Remote.load()).then(d => { db = d; if (adminTab === t) render(); }).catch(() => {});
  };
  const tabs = $("#tabs"); if (tabs) tabs.onclick = e => { const b = e.target.closest("button"); if (b) go(b.dataset.tab); };
  $$("[data-go]").forEach(a => a.onclick = () => go(a.dataset.go));
  $$("[data-acc]").forEach(b => b.onclick = () => { const k = b.dataset.acc; if (showAll) { showAll = false; $$("[data-acc]").forEach(x => openAcc.add(x.dataset.acc)); } openAcc.has(k) ? openAcc.delete(k) : openAcc.add(k); render(); });
  const ta = $("#toggleAll"); if (ta) ta.onclick = () => { showAll = !showAll; if (!showAll) openAcc.clear(); render(); };
  const ow = $("#openWizard"); if (ow) ow.onclick = () => { wizard = true; flash = ""; go("tienda"); };
  const ew = $("#exitWizard"); if (ew) ew.onclick = () => { wizard = false; flash = ""; go("panel"); };
  const ri = $("#restoreInput");
  if (ri) ri.onchange = async () => {
    const f = ri.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      db = await Remote.call("/api/admin/restore", "POST", data); Remote.db = db; keepCopy(db);
      adminTab = db.setupDone ? "panel" : "tienda"; flash = "Respaldo cargado. Todo quedó como estaba."; render();
    } catch (e) { $("#restoreMsg").textContent = e instanceof SyntaxError ? "Ese archivo no es un respaldo de PrecioZona." : e.message; }
  };
  const back = $("#backBtn"); if (back) back.onclick = () => go(adminTab === "competencia" ? "tienda" : "competencia");

  if (adminTab === "tienda") {
    const scanMsg = url => { const b = db.company.blocked; return b ? `Se cargaron ${b.total - b.count} de ${b.total} productos de ${host(url)}. El resto está bloqueado por tu tienda.` : `Se cargaron ${db.products.length} productos de ${host(url)}.`; };
    $("#scanBtn").onclick = () => { const url = $("#siteUrl").value.trim(); collectTienda(); withBusy(async () => { db = await API.scanCompany(url); flash = scanMsg(url); }); };
    const ub = $("#unblockBtn"); if (ub) ub.onclick = () => { collectTienda(); withBusy(async () => { db.company.unblocked = true; db = await API.scanCompany(db.company.site); flash = db.company.blocked ? "Todavía hay productos bloqueados. Revisá la configuración de tu web." : "Acceso habilitado. " + scanMsg(db.company.site); }); };
    const nb = $("#nextBtn"); if (nb) nb.onclick = () => { collectTienda(); save(); if (!inSetup()) { flash = "Guardado."; render(); } else go("competencia"); };
    if (focusAfter) { const el = $(focusAfter); focusAfter = null; if (el) { el.scrollIntoView({ block: "center" }); el.focus(); el.select(); } }
  }
  if (adminTab === "competencia") {
    $$("[data-shot]").forEach(b => b.onclick = () => {
      collectCompetencia(); shotFor = +b.dataset.shot;
      const c = db.chains[shotFor]; shotFiles = []; shotOthers = []; shotStatus = ""; shotRows = (c.manualCatalog || []).map(x => ({ ...x }));
      if (!shotRows.length) shotRows = [{ name: "", price: null }];
      render(); $("#shotPanel").scrollIntoView({ block: "start" });
    });
    if (shotFor !== null) {
      $("#shotInput").onchange = async e => {
        collectShots();
        const files = Array.from(e.target.files);
        files.forEach(f => shotFiles.push(URL.createObjectURL(f)));
        if (!SERVER) { render(); return; }
        // En Render: se achica cada captura y se manda de a una; el servidor lee el texto y arma la lista
        const rel = r => Math.max(0, ...db.products.map(p => E.similarity(r.name, p.name))) >= 0.3;
        const seen = new Set(shotRows.map(r => E.norm(r.name)));
        let found = 0, failed = 0;
        for (let i = 0; i < files.length; i++) {
          shotStatus = `Leyendo captura ${i + 1} de ${files.length}…`; render();
          try {
            const rows = await Remote.ocr([await shrink(files[i])]);
            rows.forEach(r => { const k = E.norm(r.name); if (seen.has(k)) return; seen.add(k); found++; (rel(r) ? shotRows : shotOthers).push(r); });
          } catch (err) { failed++; }
        }
        shotRows = shotRows.filter(r => r.name.trim() || r.price);
        if (!shotRows.length) shotRows = [{ name: "", price: null }];
        const shown = shotRows.filter(r => r.name.trim()).length;
        shotStatus = found ? `Se leyeron ${found} productos: ${shown} se parecen a los tuyos${shotOthers.length ? ` y ${shotOthers.length} no (quedaron ocultos)` : ""}. Revisá nombres y precios antes de usarlos.${failed ? ` ${failed} captura${failed === 1 ? "" : "s"} no se pudo leer.` : ""}`
          : failed ? "No se pudieron leer las capturas. Probá de nuevo en un minuto o con capturas más chicas." : "No se encontraron precios en las capturas. Completá la lista a mano.";
        render();
      };
      const so = $("#shotOthers"); if (so) so.onclick = () => { collectShots(); shotRows = shotRows.filter(r => r.name.trim()).concat(shotOthers); shotOthers = []; render(); };
      $("#shotAdd").onclick = () => { collectShots(); shotRows.push({ name: "", price: null }); render(); $(`#sn-${shotRows.length - 1}`).focus(); };
      $$("[data-sdel]").forEach(b => b.onclick = () => { collectShots(); shotRows.splice(+b.dataset.sdel, 1); render(); });
      $("#shotCancel").onclick = () => { shotFor = null; render(); };
      $("#shotUse").onclick = () => {
        collectShots();
        const rows = shotRows.filter(r => r.name.trim() && r.price > 0).map(r => ({ name: r.name.trim(), price: r.price }));
        if (!rows.length) { $("#shotErr").textContent = "Cargá al menos un producto con nombre y precio."; return; }
        const c = db.chains[shotFor];
        c.manualCatalog = rows; matchChain(c, rows); c.status = "capturas"; c.lastScan = new Date().toISOString(); c.note = `${rows.length} productos cargados desde capturas`;
        if (!db.lastScrape) db.lastScrape = c.lastScan;
        const n = Object.keys(c.matches).length;
        shotFor = null; save(); flash = `${c.name}: se cargaron ${rows.length} productos y ${n} coinciden con los tuyos.`; render();
      };
    }
    $("#compBtn").onclick = () => { collectCompetencia(); withBusy(async () => { db = await API.scanCompetitors(); const n = db.products.filter(p => db.chains.some(c => c.matches[p.id])).length; flash = `Análisis terminado: ${n} de ${db.products.length} productos tienen competencia.`; }); };
    const nb = $("#nextBtn"); if (nb) nb.onclick = () => { collectCompetencia(); save(); if (!inSetup()) { flash = "Guardado."; render(); } else go("sugeridos"); };
  }
  if (adminTab === "sugeridos") {
    $$('input[name="pm"]').forEach(r => r.onchange = () => { priceMode = r.value; render(); });
    $$("th[data-col]").forEach(h => h.onclick = () => { const k = h.dataset.col; hiddenCols.has(k) ? hiddenCols.delete(k) : hiddenCols.add(k); render(); });
    $$("[data-ov]").forEach(inp => inp.oninput = () => {
      const p = db.products.find(x => x.id === inp.dataset.ov), z = E.allZones(db).find(x => x.id === inp.dataset.z), v = Number(inp.value);
      if (!(v > 0)) return;
      const s = E.suggest(db, p, z), ev = E.evaluate(db, p, v, s), id = `${p.id}--${z.id}`;
      $(`[id="m-${id}"]`).textContent = pct(ev.margin);
      $(`[id="d-${id}"]`).innerHTML = diff(v, p);
      $(`[id="l-${id}"]`).innerHTML = lightHtml(ev);
    });
    $("#confirmPrices").onclick = () => {
      const ov = {};
      if (priceMode === "manual") {
        // también los de productos plegados: se toman del estado guardado
        ready().forEach(p => E.allZones(db).forEach(z => { const m = db.overrides[p.id] && db.overrides[p.id][z.id]; if (m) (ov[p.id] = ov[p.id] || {})[z.id] = m; }));
        for (const inp of $$("[data-ov]")) {
          const v = Number(inp.value); if (!(v > 0)) { $("#stepErr").textContent = "Hay un precio vacío o inválido."; inp.focus(); return; }
          const p = db.products.find(x => x.id === inp.dataset.ov), z = E.allZones(db).find(x => x.id === inp.dataset.z);
          if (v !== E.suggest(db, p, z).price) (ov[p.id] = ov[p.id] || {})[z.id] = v; else if (ov[p.id]) delete ov[p.id][z.id];
        }
      }
      const was = !inSetup(); db.overrides = ov; db.setupDone = true; wizard = false; save();
      go("panel"); flash = was ? "Precios guardados." : "Listo. Ya podés ver el panel, los clientes o entrar a la tienda de prueba."; render();
    };
  }
  if (adminTab === "panel" && $("#prodSel")) {
    $("#prodSel").onchange = e => { selProd = e.target.value; render(); };
    $$("[data-calc]").forEach(b => b.onclick = e => { e.stopPropagation(); const [pid, zid] = b.dataset.calc.split("|"); openPopover(b, calcHtml(db.products.find(p => p.id === pid), E.allZones(db).find(z => z.id === zid))); });
    $("#costLink").onclick = () => { focusAfter = "#pc-" + db.products.findIndex(p => p.id === selProd); go("tienda"); };
  }
  if (adminTab === "clientes") $$("[data-cust]").forEach(b => b.onclick = () => { openCustomer = openCustomer === b.dataset.cust ? null : b.dataset.cust; render(); });
  if (adminTab === "exportar") $("#copyBtn").onclick = async () => {
    try { await navigator.clipboard.writeText($("#copyArea").value); $("#copyMsg").textContent = "Copiado. Pegalo en Excel o Google Sheets."; }
    catch { const t = $("#copyArea"); t.hidden = false; t.focus(); t.select(); $("#copyMsg").textContent = "Seleccioné la tabla: copiala con Ctrl+C."; }
  };
  if (adminTab === "datos") {
    $("#saveBtn").onclick = () => {
      const n = v => Number(v);
      const P = { margenMin: n($("#pMargen").value) / 100, tope: n($("#pTope").value) / 100, costoPct: n($("#pCosto").value) / 100, maxAumento: n($("#pMax").value) / 100, umbralPerfil: n($("#pUmbral").value) };
      if (Object.values(P).some(x => !Number.isFinite(x) || x < 0) || P.margenMin >= 0.9 || P.umbralPerfil >= 100) { $("#stepErr").textContent = "Revisá los valores: hay alguno fuera de rango."; return; }
      db.params = P;
      $$("[data-zf]").forEach(el => { db.zones[el.dataset.zf].factor = n(el.value) || db.zones[el.dataset.zf].factor; });
      db.zones.forEach((z, i) => { const boxes = $$(`[data-zc="${i}"]`); if (boxes.length) z.chains = boxes.filter(x => x.checked).map(x => x.value); });
      $$("[data-bz]").forEach(el => { db.barrios[el.dataset.bz].zoneId = el.value; });
      for (const el of $$("[data-ba]")) { const v = Number(el.value); if (!Number.isFinite(v) || v < -3 || v > 3) { $("#stepErr").textContent = "El ajuste de cada barrio tiene que estar entre −3% y +3%."; el.focus(); return; } db.barrios[el.dataset.ba].ajuste = v; }
      save(); flash = "Guardado. Los precios se recalcularon."; render();
    };
    $("#resetBtn").onclick = () => { const s = E.clone(E.SEED); s.customers = E.clone(DEMO_CUSTOMERS); db = API.save(s); Object.keys(cart).forEach(k => delete cart[k]); go("tienda"); flash = "Se restableció el ejemplo. Empieza de nuevo la configuración."; render(); };
  }
}

// ================= TIENDA DE PRUEBA =================
// Simula la web de un cliente que tiene instalado el script de PrecioZona
let actingAs = readStore("pz-as") || "yo";
const cart = {};
let cartOpen = false, cookieOpen = false, cookieReason = "", shipMode = "envio", shipLoc = "", checkoutStep = false, lastOrder = null, payMethod = "credito";

function me() {
  let c = db.customers.find(x => x.id === actingAs);
  if (!c) { c = { id: "yo", name: "Vos (visitante real)", fictional: false, consent: null, locks: {}, signals: { visitas: 0, vistos: [], carritosAbandonados: 0 } }; db.customers.unshift(c); save(); }
  return c;
}
// Lo que el navegador permite saber después de aceptar
function collectSignals(c) {
  const ua = navigator.userAgent;
  const os = /iPhone|iPad/.test(ua) ? "iPhone/iPad (iOS)" : /Mac OS X/.test(ua) ? "Mac (macOS)" : /Android/.test(ua) ? "Android" : /Windows/.test(ua) ? "Windows" : /Linux/.test(ua) ? "Linux" : "Otro";
  const nav = /Edg\//.test(ua) ? "Edge" : /Chrome\//.test(ua) ? "Chrome" : /Safari\//.test(ua) ? "Safari" : /Firefox\//.test(ua) ? "Firefox" : "Otro";
  const ref = document.referrer || "";
  const origen = /instagram|facebook/i.test(ref) ? "instagram" : /google/i.test(ref) ? "google" : /mail/i.test(ref) ? "email" : "directo";
  Object.assign(c.signals, {
    dispositivo: { tipo: /Mobi|Android|iPhone/.test(ua) ? "celular" : "computadora", os, navegador: nav, pantalla: `${screen.width} × ${screen.height}`, memoria: navigator.deviceMemory || null, nucleos: navigator.hardwareConcurrency || null },
    idioma: navigator.language, zonaHoraria: Intl.DateTimeFormat().resolvedOptions().timeZone, origen,
    hora: new Date().getHours(), visitas: (c.signals.visitas || 0) + 1
  });
}
// Antes de elegir barrio: zona conocida de la persona. Al elegir barrio o sucursal en el carrito: su zona + ajuste del barrio.
function locPrice(p) { const li = E.locInfo(db, shipLoc); return E.personalPrice(db, p, E.findZone(db, li ? li.zoneId : E.knownZone(db, me())), me(), li ? li.barrio : null); }
const priceFor = p => E.personalPrice(db, p, E.findZone(db, E.knownZone(db, me())), me());
function locOptions() {
  return shipMode === "envio"
    ? `<option value="">Elegí tu barrio</option>` + db.barrios.map((b, i) => ({ b, i })).sort((x, y) => x.b.name.localeCompare(y.b.name, "es")).map(({ b, i }) => `<option value="b:${i}">${esc(b.name)}</option>`).join("")
    : `<option value="">Elegí una sucursal</option>` + db.pickups.map(p => `<option value="p:${p.id}">${esc(p.name)}</option>`).join("");
}

function viewTienda() {
  if (!db) return `<div class="gut"><div class="wrap page"><div class="alert">Para usar el simulador, primero iniciá sesión en el <a href="#admin">back-office</a>.</div></div></div>`;
  if (!db.setupDone || !ready().length) return `<div class="gut"><div class="wrap page"><div class="alert">Primero terminá la configuración en el back-office.</div></div></div>`;
  const c = me(), ok = c.consent === true;
  const nCart = Object.values(cart).reduce((a, b) => a + b, 0);
  const kz = E.findZone(db, E.knownZone(db, c));
  return `<div class="demo-bar gut"><div class="wrap"><b>Simulador</b><label for="asSel">Navegar como</label>
      <select id="asSel">${db.customers.map(x => `<option value="${esc(x.id)}" ${x.id === actingAs ? "selected" : ""}>${esc(x.name)}${x.fictional ? " (ficticio)" : ""}</option>`).join("")}</select>
      <button id="resetCookies">Borrar mis cookies</button><span style="opacity:.75">${ok ? `Zona usada: ${esc(kz.estimated ? "sin barrio elegido" : kz.name)}. El barrio se elige al pagar.` : `Así se vería la web de ${esc(E.companyName(db))} con el script de PrecioZona.`}</span></div></div>
    <div class="gut"><div class="wrap page" style="padding-top:0">
      <div class="shop-head"><h1>Cremas corporales</h1><div class="sp"></div>
        <span class="muted">Envío gratis en Montevideo o retiro en sucursal</span>
        <button class="btn ghost cartbtn" id="cartBtn">Carrito ${nCart ? `<b>${nCart}</b>` : ""}</button></div>
      ${!ok ? `<div class="alert">Aceptá las cookies para ver los precios y poder comprar. <button class="link" id="openCookie">Ver el aviso</button></div>` : ""}
      <div class="cards">${ready().map(p => { const r = priceFor(p); return `<div class="pcard">
        <div class="ph">${esc(p.name.replace(/^Crema (Corporal |Hidratante )?/, ""))}</div><h3>${esc(p.name)}</h3>
        ${ok ? `<div class="pr num">${fmt(r.final)}</div>${r.locked ? `<div class="muted">Mismo precio que tu compra anterior</div>` : ""}` : `<div class="lock">Precio disponible al aceptar las cookies</div>`}
        <button class="btn" data-add="${esc(p.id)}">Agregar al carrito</button></div>`; }).join("")}</div>
    </div></div>
    ${cartOpen ? viewCart() : ""}
    ${cookieOpen ? viewCookie() : ""}`;
}
function viewCart() {
  const c = me(), ok = c.consent === true;
  const items = Object.entries(cart).filter(([, q]) => q > 0).map(([id, q]) => ({ p: db.products.find(x => x.id === id), q }));
  const li = E.locInfo(db, shipLoc);
  const total = ok ? items.reduce((a, { p, q }) => a + locPrice(p).final * q, 0) : 0;
  const adj = li && li.barrio && li.barrio.ajuste ? li.barrio.ajuste : 0;
  if (lastOrder) return `<div class="drawer" role="dialog" aria-label="Pedido confirmado"><h2>Pedido confirmado</h2><p>Número <b>${esc(lastOrder.id)}</b> · total <b>${fmt(lastOrder.total)}</b></p>
    <p class="muted">Si volvés a comprar estos productos, vas a pagar el mismo precio.</p><button class="btn full" id="closeCart">Seguir comprando</button></div>`;
  return `<div class="drawer" role="dialog" aria-label="Carrito"><h2>Carrito</h2>
    ${items.length ? items.map(({ p, q }) => `<div class="line"><span>${esc(p.name)} × ${q}</span><span class="num">${ok ? fmt(locPrice(p).final * q) : "—"}</span></div>`).join("") : `<p class="muted">El carrito está vacío.</p>`}
    ${items.length && ok ? `<div class="line"><b>Total</b><b class="num">${fmt(total)}</b></div>` : ""}
    ${checkoutStep && ok ? `<p class="muted" style="margin:14px 0 6px">¿Cómo lo recibís?</p>
      <span class="seg" id="shipSeg"><button data-ship="envio" class="${shipMode === "envio" ? "on" : ""}">Envío a domicilio</button><button data-ship="retiro" class="${shipMode === "retiro" ? "on" : ""}">Retiro en sucursal</button></span>
      <select id="shipSel" aria-label="Barrio o sucursal" style="width:100%;margin-top:8px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--surface)">${locOptions()}</select>
      ${li ? `<p class="note">${li.barrio ? `Envío a ${esc(li.label)}.` : `Retiro en ${esc(li.label)}.`}</p>` : ""}
      <label class="muted" for="paySel" style="display:block;margin-top:12px">Medio de pago</label>
      <select id="paySel" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--surface)">${[["credito", "Tarjeta de crédito"], ["debito", "Tarjeta de débito"], ["transferencia", "Transferencia"], ["efectivo", "Efectivo en sucursal"]].map(([v, l]) => `<option value="${v}" ${v === payMethod ? "selected" : ""}>${l}</option>`).join("")}</select>
      <div class="err" id="payErr"></div>` : ""}
    <div class="actions">${items.length ? `<button class="btn" id="checkoutBtn">${checkoutStep && ok ? "Pagar" : "Finalizar compra"}</button>` : ""}<button class="btn ghost" id="closeCart">Cerrar</button></div></div>`;
}
let termsOpen = false;
function viewCookie() {
  return `<div class="scrim" role="dialog" aria-modal="true" aria-label="Aviso de cookies"><div class="cookie">
    <h3>Usamos cookies</h3>
    <p style="margin:0">${cookieReason || `Usamos cookies propias y de terceros para que el sitio funcione, recordar tu carrito y mejorar tu experiencia de compra. Para ver precios y comprar es necesario aceptarlas.`}</p>
    <p style="margin:8px 0 0;font-size:13px"><button class="link" id="termsBtn" aria-expanded="${termsOpen}">${termsOpen ? "Ocultar" : "Ver"} términos y condiciones de cookies</button></p>
    ${termsOpen ? `<div class="terms">
      <p><b>Términos y condiciones de uso de cookies de ${esc(E.companyName(db))}.</b> Al aceptar, autorizás a ${esc(E.companyName(db))} y a su proveedor tecnológico a almacenar cookies en tu dispositivo y a tratar los datos que se detallan, conforme a la Ley N° 18.331 de Protección de Datos Personales.</p>
      <p><b>1. Cookies técnicas.</b> Necesarias para el funcionamiento del sitio, el carrito y la sesión.</p>
      <p><b>2. Cookies de preferencias.</b> Guardan tu barrio o sucursal de entrega y tus elecciones anteriores.</p>
      <p><b>3. Cookies de análisis y personalización.</b> Recolectan: barrio o sucursal de entrega, ubicación aproximada según tu conexión, ubicación del dispositivo cuando la autorizás, zonas desde las que accedés al sitio, compras realizadas en esta tienda y montos, productos visitados, carritos no finalizados, cantidad y horario de visitas, tipo de dispositivo, sistema operativo, navegador, pantalla, memoria y procesador, idioma, zona horaria, sitio de origen de la visita y medio de pago elegido. Estos datos se usan para elaborar un perfil de compra y <b>personalizar los precios y ofertas que se te muestran</b>, que pueden variar entre usuarios. El precio que se muestra antes de confirmar la compra es el precio final.</p>
      <p><b>4. Conservación y derechos.</b> Los datos se conservan mientras mantengas la aceptación. Podés retirarla en cualquier momento borrando las cookies, y ejercer tus derechos de acceso, rectificación y supresión escribiendo a ${esc(db.company.name.toLowerCase().replace(/\s+/g, ""))}@ejemplo.com.uy.</p>
      <p><b>5. Rechazo.</b> Si no aceptás las cookies de análisis y personalización, podés navegar el catálogo, pero no ver precios ni finalizar compras, porque el precio se calcula para cada usuario.</p></div>` : ""}
    <div class="actions"><button class="btn ghost" id="rejectCk">Rechazar</button><button class="btn" id="acceptCk">Aceptar</button></div></div></div>`;
}
function bindTienda() {
  if (!$("#asSel")) return;
  const c = me();
  $("#asSel").onchange = e => { actingAs = e.target.value; writeStore("pz-as", actingAs); Object.keys(cart).forEach(k => delete cart[k]); shipLoc = ""; checkoutStep = false; lastOrder = null; cartOpen = false; cookieOpen = me().consent == null; render(); };
  $("#resetCookies").onclick = () => { const x = me(); x.consent = null; if (!x.fictional) x.signals = { visitas: 0, vistos: [], carritosAbandonados: 0 }; x.locks = x.fictional ? x.locks : {}; save(); cookieOpen = true; cookieReason = ""; render(); };
  const oc = $("#openCookie"); if (oc) oc.onclick = () => { cookieOpen = true; render(); };
  $$("[data-ship]").forEach(b => b.onclick = () => { shipMode = b.dataset.ship; shipLoc = ""; render(); });
  const ss = $("#shipSel"); if (ss) { ss.value = shipLoc; ss.onchange = () => { shipLoc = ss.value; render(); }; }
  $$("[data-add]").forEach(b => b.onclick = () => { const id = b.dataset.add; cart[id] = (cart[id] || 0) + 1; if (c.consent) { const v = c.signals.vistos || (c.signals.vistos = []); if (!v.includes(id)) v.push(id); save(); } lastOrder = null; render(); });
  $("#cartBtn").onclick = () => { cartOpen = true; lastOrder = null; render(); };
  const cc = $("#closeCart"); if (cc) cc.onclick = () => {
    if (!lastOrder && Object.values(cart).some(q => q > 0) && checkoutStep && me().consent) { me().signals.carritosAbandonados = (me().signals.carritosAbandonados || 0) + 1; save(); }
    cartOpen = false; checkoutStep = false; if (lastOrder) lastOrder = null; render();
  };
  const ps = $("#paySel"); if (ps) ps.onchange = () => { payMethod = ps.value; };
  const cb = $("#checkoutBtn"); if (cb) cb.onclick = () => {
    const x = me();
    if (!x.consent) { cookieOpen = true; cookieReason = "Para comprar necesitamos calcular tu precio, y para eso tenés que aceptar las cookies."; render(); return; }
    if (!checkoutStep) { checkoutStep = true; render(); return; }
    if (!shipLoc) { $("#payErr").textContent = "Elegí tu barrio o una sucursal."; return; }
    const items = Object.entries(cart).filter(([, q]) => q > 0);
    let total = 0;
    items.forEach(([id, q]) => { const p = db.products.find(y => y.id === id), r = locPrice(p); total += r.final * q; x.locks[id] = x.locks[id] || r.final; });
    const li = E.locInfo(db, shipLoc);
    x.signals.pago = payMethod; x.signals.zonaEntrega = li.zoneId; if (li.barrio) x.signals.barrio = li.label;
    const order = { id: "PZ-" + (1001 + db.orders.length), date: new Date().toISOString(), customerId: x.id, total, items: items.map(([id, q]) => ({ id, q })) };
    db.orders.unshift(order); save();
    Object.keys(cart).forEach(k => delete cart[k]); checkoutStep = false; lastOrder = order; render();
  };
  if (cookieOpen) {
    $("#termsBtn").onclick = () => { termsOpen = !termsOpen; render(); };
    $("#acceptCk").onclick = () => { const x = me(); x.consent = true; x.consentDate = new Date().toISOString(); if (!x.fictional) collectSignals(x); save(); cookieOpen = false; cookieReason = ""; render(); };
    $("#rejectCk").onclick = () => { const x = me(); x.consent = false; save(); cookieOpen = false; cookieReason = ""; render(); };
  }
}

// ================= RUTEO =================
function render() {
  const h = location.hash.slice(1) || "admin";
  $$("#nav a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + h));
  closePopover();
  if (h === "tienda") { $("#app").innerHTML = viewTienda(); bindTienda(); return; }
  $("#app").innerHTML = viewAdmin(); bindAdmin();
}
window.addEventListener("hashchange", () => {
  flash = "";
  if (location.hash === "#tienda" && db) { cookieOpen = me().consent == null; }
  render(); window.scrollTo(0, 0);
});
(async () => {
  if (SERVER) { try { if (await Remote.session()) { db = await Remote.load(); adminOk = true; } } catch (e) {} }
  if (location.hash === "#tienda" && db) cookieOpen = me().consent == null;
  render();
})();
